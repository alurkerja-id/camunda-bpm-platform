# Alurkerja fork: SonarQube analysis settings.
# Loaded into the Maven build by properties-maven-plugin (see the root pom.xml), so the scan
# is just:
#
#   mvn clean install -Dmaven.test.failure.ignore=true sonar:sonar -Dsonar.login=<token>
#
# The properties file is read in the "initialize" phase, so sonar:sonar must run in the same
# Maven invocation as a lifecycle phase (clean/install above). A bare `mvn sonar:sonar` runs no
# phase and would fall back to the Maven defaults.

sonar.host.url=https://sonar.javan.co.id
sonar.projectKey=alurkerja-camunda-bpm-platform
sonar.projectName=Alurkerja Camunda BPM Platform

# Not production code - keep it out of the analysis entirely.
sonar.exclusions=**/src/test/**,**/src/it/**,**/target/**,**/node_modules/**,**/dist/**,**/*.min.js

# sonar.exclusions only filters the *source* space. The Maven scanner puts test files in the
# *test* space (qualifier UTS), which has its own filter - without this line the code smells
# reported on unit tests (java:S2699 and friends) stay OPEN.
sonar.test.exclusions=**/src/test/**,**/src/it/**

# Coverage is measured on production code only.
sonar.coverage.exclusions=**/src/test/**,**/src/it/**,**/qa/**,**/examples/**

# sonar.coverage.jacoco.xmlReportPaths is NOT set here. It has to name the aggregate report by an
# absolute path, which only Maven can build per module, so it lives in parent/pom.xml instead.
